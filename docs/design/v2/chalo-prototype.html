<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Updated] Chalo ਚਲੋ — Clickable Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+Gurmukhi:wght@400;500;600;700&family=Fraunces:ital,wght@0,700;1,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS
============================================================ */
:root {
  --saffron: #F95C00;  --saffron-d: #CC4A00;
  --saffron-10: rgba(249,92,0,0.10);
  --saffron-15: rgba(249,92,0,0.15);
  --saffron-25: rgba(249,92,0,0.25);
  --navy: #0F1629;     --navy-mid: #2D3461;
  --green: #34D399;    --green-d: #10B981;
  --green-10: rgba(52,211,153,0.10);
  --green-15: rgba(52,211,153,0.15);
  --green-30: rgba(52,211,153,0.30);
  --red: #E74C3C;
  --red-10: rgba(231,76,60,0.10);
  --amber: #F39C12;
  --amber-10: rgba(243,156,18,0.10);
  --bg: #FFFDF9;
  --white: #FFFFFF;
  --tp: #374151;  --ts: #6B7280;
  --border: #E5E7EB;

  --sh-sm:  0 1px 4px rgba(0,0,0,0.28);
  --sh-md:  0 4px 16px rgba(0,0,0,0.38);
  --sh-lg:  0 8px 32px rgba(0,0,0,0.48);
  --sh-xl:  0 16px 48px rgba(0,0,0,0.55);
  --glow-s: 0 0 32px rgba(249,92,0,0.28);
  --glow-g: 0 0 24px rgba(52,211,153,0.35);
  --glow-d: 0 4px 20px rgba(231,76,60,0.45);

  --ease-out:    cubic-bezier(0.16,1,0.3,1);
  --ease-spring: cubic-bezier(0.34,1.56,0.64,1);
  --ease-in:     cubic-bezier(0.55,0,1,0.45);
}

/* ============================================================
   SHELL LAYOUT
============================================================ */
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: #0A0C14;
  font-family: 'Poppins', sans-serif;
  min-height: 100vh;
  overflow: hidden;
}

/* Outer wrapper */
.proto-shell {
  display: flex;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
}

/* Left sidebar */
.proto-sidebar {
  width: 260px;
  flex-shrink: 0;
  background: #0F1117;
  border-right: 1px solid #1E2030;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.sidebar-top {
  padding: 24px 20px 18px;
  border-bottom: 1px solid #1E2030;
}
.sidebar-logo {
  font-family: 'Fraunces', serif;
  font-size: 22px;
  color: var(--saffron);
}
.sidebar-sub {
  font-size: 10px;
  color: #3D4560;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-top: 3px;
}
.sidebar-doc {
  font-size: 10px;
  color: #4B5563;
  margin-top: 6px;
}

.flow-group {
  padding: 16px 0 8px;
  border-bottom: 1px solid #1E2030;
}
.flow-group-title {
  font-size: 9px;
  font-weight: 700;
  color: #3D4560;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 0 20px 8px;
}
.flow-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 20px;
  cursor: pointer;
  transition: background 120ms;
  border-left: 2px solid transparent;
}
.flow-item:hover { background: rgba(255,255,255,0.03); }
.flow-item.active {
  border-left-color: var(--saffron);
  background: rgba(249,92,0,0.06);
}
.flow-item.active .flow-label { color: var(--saffron); }
.flow-num {
  font-family: 'JetBrains Mono';
  font-size: 10px;
  color: #3D4560;
  min-width: 18px;
}
.flow-item.active .flow-num { color: rgba(249,92,0,0.6); }
.flow-label { font-size: 12px; font-weight: 600; color: #6B7280; line-height: 1.3; }

.app-toggle {
  padding: 16px 20px;
  border-bottom: 1px solid #1E2030;
}
.toggle-pills {
  display: flex;
  background: #1A1D2E;
  border-radius: 8px;
  padding: 3px;
  gap: 3px;
}
.toggle-pill {
  flex: 1;
  height: 30px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #4B5563;
  transition: all 200ms;
}
.toggle-pill.active-c { background: var(--saffron); color: white; }
.toggle-pill.active-d { background: var(--green); color: #0A0C14; }

/* Screen steps in sidebar */
.step-list {
  padding: 12px 0;
}
.step-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 20px;
  cursor: pointer;
  transition: all 120ms;
}
.step-item:hover .step-label { color: #9CA3AF; }
.step-item.done .step-dot { background: var(--saffron); }
.step-item.done .step-label { color: #6B7280; }
.step-item.current .step-dot { background: var(--saffron); box-shadow: 0 0 8px rgba(249,92,0,0.6); }
.step-item.current .step-label { color: white; font-weight: 600; }
.step-item.current-d .step-dot { background: var(--green); box-shadow: 0 0 8px rgba(52,211,153,0.5); }
.step-item.current-d .step-label { color: white; font-weight: 600; }
.step-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #2D3148;
  flex-shrink: 0;
  transition: all 200ms;
}
.step-label {
  font-size: 11px;
  color: #374151;
  line-height: 1.3;
}
.step-connector {
  width: 1px; height: 14px;
  background: #1E2030;
  margin-left: 23px;
}

/* Sidebar footer */
.sidebar-footer {
  margin-top: auto;
  padding: 16px 20px;
  border-top: 1px solid #1E2030;
  font-size: 10px;
  color: #2D3148;
  line-height: 1.6;
}

/* ============================================================
   PHONE FRAME
============================================================ */
.proto-main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px;
  overflow: hidden;
  position: relative;
}

/* Ambient glow behind phone */
.phone-glow {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 50% 60% at 50% 50%, rgba(249,92,0,0.06) 0%, transparent 70%);
  pointer-events: none;
  transition: background 600ms;
}
.phone-glow.driver-glow {
  background: radial-gradient(ellipse 50% 60% at 50% 50%, rgba(52,211,153,0.06) 0%, transparent 70%);
}

.phone-frame {
  position: relative;
  width: 360px;
  height: 780px;
  background: var(--bg);
  border-radius: 40px;
  overflow: hidden;
  box-shadow:
    0 0 0 10px #111218,
    0 0 0 11px #1E2030,
    0 40px 100px rgba(0,0,0,0.8);
  flex-shrink: 0;
}

/* Dynamic island */
.dynamic-island {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  width: 120px; height: 34px;
  background: #0A0C14;
  border-radius: 20px;
  z-index: 100;
}

/* Status bar */
.status-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 52px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding: 0 28px 8px;
  z-index: 50;
  pointer-events: none;
}
.status-time {
  font-size: 14px;
  font-weight: 700;
  color: var(--navy);
}
.status-icons { font-size: 13px; color: var(--navy); display: flex; gap: 4px; align-items: center; }
.status-bar.light .status-time,
.status-bar.light .status-icons { color: rgba(255,255,255,0.9); }

/* Screen container */
.screen-wrap {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: 40px;
}

/* Individual screens */
.screen {
  position: absolute;
  inset: 0;
  background: var(--bg);
  border-radius: 40px;
  overflow: hidden;
  transform: translateX(100%);
  transition: transform 320ms var(--ease-out);
  will-change: transform;
}
.screen.active {
  transform: translateX(0);
}
.screen.prev {
  transform: translateX(-30%);
}

/* Bottom nav */
.bottom-nav {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 64px;
  background: var(--white);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 30;
  border-radius: 0 0 40px 40px;
}
.nav-tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-size: 9px;
  font-weight: 500;
  color: var(--ts);
  cursor: pointer;
  position: relative;
  transition: color 150ms;
}
.nav-tab.active-s { color: var(--saffron); }
.nav-tab.active-g { color: var(--green); }
.nav-tab.active-s::before,
.nav-tab.active-g::before {
  content: '';
  position: absolute;
  top: 0; left: 20%; right: 20%;
  height: 2px;
  border-radius: 0 0 2px 2px;
}
.nav-tab.active-s::before { background: var(--saffron); }
.nav-tab.active-g::before { background: var(--green); }
.nav-icon { font-size: 19px; line-height: 1; }

/* Content area (below status, above nav) */
.screen-content {
  position: absolute;
  top: 52px;
  bottom: 64px;
  left: 0; right: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}
.screen-content::-webkit-scrollbar { display: none; }
.screen-content.no-nav { bottom: 0; }
.screen-content.no-status { top: 0; }

/* ============================================================
   RIGHT PANEL — CTA / ANNOTATIONS
============================================================ */
.proto-right {
  width: 280px;
  flex-shrink: 0;
  background: #0F1117;
  border-left: 1px solid #1E2030;
  display: flex;
  flex-direction: column;
  padding: 24px 20px;
  overflow-y: auto;
}
.panel-title {
  font-family: 'Fraunces', serif;
  font-size: 16px;
  color: var(--saffron);
  margin-bottom: 4px;
}
.panel-screen-name {
  font-size: 11px;
  color: #4B5563;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 16px;
}

/* Annotation cards */
.annot-card {
  background: #1A1D2E;
  border: 1px solid #1E2030;
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 10px;
}
.annot-key {
  font-size: 10px;
  font-weight: 700;
  color: var(--saffron);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.annot-val {
  font-size: 11px;
  color: #9CA3AF;
  line-height: 1.5;
}
.annot-card.green .annot-key { color: var(--green); }
.annot-card.red   .annot-key { color: var(--red); }
.annot-card.amber .annot-key { color: var(--amber); }

.panel-divider { height: 1px; background: #1E2030; margin: 14px 0; }

/* Nav arrows */
.nav-arrows {
  display: flex;
  gap: 8px;
  margin-top: auto;
  padding-top: 16px;
  border-top: 1px solid #1E2030;
  flex-shrink: 0;
}
.nav-arr {
  flex: 1;
  height: 40px;
  background: #1A1D2E;
  border: 1px solid #1E2030;
  border-radius: 8px;
  color: #6B7280;
  font-size: 18px;
  cursor: pointer;
  transition: all 150ms;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Poppins;
}
.nav-arr:hover { background: #21253A; color: #9CA3AF; }
.nav-arr.primary {
  background: var(--saffron);
  border-color: var(--saffron);
  color: white;
  font-size: 12px;
  font-weight: 700;
}
.nav-arr.primary:hover { background: var(--saffron-d); }
.nav-arr.primary.green-btn { background: var(--green); border-color: var(--green); color: #0A0C14; }
.nav-arr.primary.green-btn:hover { background: var(--green-d); }
.nav-arr:disabled { opacity: 0.3; cursor: not-allowed; }

/* ============================================================
   SCREEN COMPONENTS (app UI elements)
============================================================ */

/* Map area */
.map-area {
  width: 100%; height: 100%;
  position: relative;
  overflow: hidden;
  background: #E8EFDA;
}
.map-bg {
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(200,210,180,0.5) 39px, rgba(200,210,180,0.5) 40px),
    repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(200,210,180,0.5) 39px, rgba(200,210,180,0.5) 40px),
    #E8F0D5;
}
/* Roads */
.road {
  position: absolute;
  background: rgba(255,255,255,0.9);
}
.road-h { height: 12px; left: 0; right: 0; border-radius: 0; }
.road-v { width: 12px; top: 0; bottom: 0; }
.road-main { background: rgba(255,255,255,1); }
/* Location pins */
.map-pin {
  position: absolute;
  display: flex; flex-direction: column; align-items: center;
  transform: translate(-50%, -100%);
  z-index: 10;
}
.map-pin-icon {
  width: 36px; height: 36px;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--sh-md);
}
.map-pin-icon span { transform: rotate(45deg); font-size: 16px; }
.map-pin-dot { width: 8px; height: 8px; background: rgba(0,0,0,0.2); border-radius: 50%; margin-top: 2px; }
/* Rider marker */
.rider-marker {
  position: absolute;
  transform: translate(-50%,-50%);
  z-index: 10;
}
.rider-dot {
  width: 44px; height: 44px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  background: white;
  box-shadow: var(--sh-md);
  border: 2px solid var(--navy);
  animation: rider-bob 2s ease-in-out infinite;
}
@keyframes rider-bob {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-4px); }
}
/* Route line */
.route-line {
  position: absolute;
  background: var(--saffron);
  height: 3px;
  border-radius: 2px;
  transform-origin: left center;
}
/* Accuracy circle */
.gps-circle {
  position: absolute;
  transform: translate(-50%,-50%);
  border-radius: 50%;
  background: rgba(249,92,0,0.08);
  border: 1.5px solid rgba(249,92,0,0.2);
  animation: gps-pulse 3s ease-in-out infinite;
}
@keyframes gps-pulse {
  0%,100% { transform: translate(-50%,-50%) scale(1); opacity: 0.8; }
  50%      { transform: translate(-50%,-50%) scale(1.1); opacity: 0.5; }
}

/* Bottom sheet (home, search, etc) */
.bottom-sheet {
  position: absolute;
  bottom: 64px; left: 0; right: 0;
  background: var(--white);
  border-radius: 24px 24px 0 0;
  padding: 12px 0 0;
  box-shadow: 0 -4px 32px rgba(0,0,0,0.15);
}
.sheet-handle {
  width: 36px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 0 auto 14px;
}

/* Search bar in map */
.map-search-bar {
  margin: 12px 16px 0;
  height: 48px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 9999px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
  cursor: text;
  transition: all 150ms;
}
.map-search-bar:hover {
  border-color: rgba(249,92,0,0.3);
  background: white;
}
.search-ph {
  font-family: 'Noto Sans Gurmukhi';
  font-size: 13px;
  color: var(--ts);
}

/* Fare estimate strip */
.fare-strip {
  padding: 16px 16px 8px;
}
.fare-big {
  font-size: 28px;
  font-weight: 800;
  color: var(--navy);
  font-variant-numeric: tabular-nums;
  letter-spacing: -1px;
  line-height: 1;
}
.fare-meta {
  font-size: 12px;
  color: var(--ts);
  margin-top: 4px;
}

/* Payment row */
.payment-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  border-top: 1px solid var(--border);
}
.payment-chip {
  display: flex; align-items: center; gap: 6px;
  background: rgba(74,144,217,0.08);
  border: 1px solid rgba(74,144,217,0.2);
  border-radius: 9999px;
  padding: 4px 12px;
  font-size: 12px; font-weight: 700;
  color: #4A90D9;
  cursor: pointer;
}
.change-link { font-size: 11px; color: var(--saffron); font-weight: 600; cursor: pointer; }

/* Customer card */
.customer-strip {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--bg);
  margin: 0 16px;
  border-radius: 12px;
}
.cust-avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, #4A90D9, #2D5FA8);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
  border: 2px solid white;
}
.cust-name { font-size: 15px; font-weight: 700; color: var(--navy); }
.cust-meta { font-size: 11px; color: var(--ts); margin-top: 2px; display: flex; gap: 8px; }

/* ETA chip */
.eta-chip {
  background: var(--green-10);
  border: 1px solid var(--green-30);
  border-radius: 9999px;
  padding: 4px 12px;
  font-size: 12px; font-weight: 700;
  color: var(--green);
  margin-left: auto;
  flex-shrink: 0;
}

/* Ripple animation (searching) */
.ripple-wrap {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
}
.ripple {
  position: absolute;
  top: 50%; left: 50%;
  border-radius: 50%;
  border: 2px solid rgba(249,92,0,0.25);
  transform: translate(-50%,-50%) scale(0);
  animation: ripple-out 2.4s ease-out infinite;
}
.ripple:nth-child(1) { animation-delay: 0s; }
.ripple:nth-child(2) { animation-delay: 0.6s; }
.ripple:nth-child(3) { animation-delay: 1.2s; }
.ripple:nth-child(4) { animation-delay: 1.8s; }
@keyframes ripple-out {
  0%   { width:0; height:0; opacity:1; }
  100% { width:280px; height:280px; opacity:0; }
}

/* Stars rating */
.stars { display: flex; gap: 4px; }
.star {
  font-size: 28px;
  cursor: pointer;
  transition: transform 150ms var(--ease-spring);
  color: var(--border);
}
.star.lit { color: var(--amber); }
.star:hover { transform: scale(1.2); }

/* Countdown ring */
.ring-wrap {
  position: relative;
  display: flex; align-items: center; justify-content: center;
}
.ring-wrap svg { transform: rotate(-90deg); }
.ring-number {
  position: absolute;
  font-weight: 800;
  font-family: 'Poppins';
  line-height: 1;
}

/* Buttons */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-family: 'Poppins'; font-weight: 700; border: none; cursor: pointer;
  border-radius: 8px; transition: all 120ms var(--ease-out);
}
.btn:active { transform: scale(0.97); }
.btn-p    { background: var(--saffron); color: white; height: 54px; font-size: 16px; box-shadow: var(--glow-s), var(--sh-md); }
.btn-p:hover { background: var(--saffron-d); }
.btn-g    { background: var(--green); color: #0A0C14; height: 54px; font-size: 16px; box-shadow: var(--glow-g); }
.btn-g:hover { background: var(--green-d); }
.btn-acc  { background: var(--green); color: #0A0C14; height: 60px; font-size: 18px; font-weight: 800; box-shadow: var(--glow-g); }
.btn-acc:hover { background: var(--green-d); }
.btn-rej  { background: transparent; color: var(--red); height: 60px; font-size: 14px; font-weight: 700; border: 1.5px solid var(--red); }
.btn-sec  { background: transparent; color: var(--saffron); height: 48px; font-size: 14px; font-weight: 600; border: 1.5px solid var(--saffron); }
.btn-ghost { background: transparent; color: var(--ts); height: 48px; font-size: 14px; font-weight: 600; border: 1.5px solid var(--border); }
.btn-safe  { background: var(--green); color: #0A0C14; height: 48px; font-size: 14px; font-weight: 700; box-shadow: var(--glow-g); }
.btn-danger { background: var(--red); color: white; height: 48px; font-size: 14px; font-weight: 700; box-shadow: var(--glow-d); }
.btn-dark  { background: var(--navy); color: white; height: 44px; font-size: 13px; font-weight: 700; }
.btn-nav   { background: var(--navy); color: white; height: 54px; font-size: 15px; font-weight: 700; box-shadow: var(--sh-md); }
.btn-w { width: 100%; }
.full-pad { padding: 0 16px; }

/* Section header in screens */
.scr-header {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px 14px;
}
.back-btn {
  width: 36px; height: 36px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; cursor: pointer; flex-shrink: 0;
  transition: all 120ms;
}
.back-btn:hover { background: var(--border); }
.scr-title { font-size: 17px; font-weight: 700; color: var(--navy); }

/* Chip inline */
.chip-inline {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 700;
  padding: 3px 10px; border-radius: 4px;
}
.chip-cash { background: rgba(74,144,217,0.10); color: #4A90D9; }
.chip-upi  { background: var(--green-10); color: var(--green); }
.chip-sched{ background: rgba(147,51,234,0.10); color: #9333EA; }
.chip-green-pill {
  background: var(--green-10);
  border: 1px solid var(--green-30);
  color: var(--green);
  border-radius: 9999px;
  padding: 4px 12px;
  font-size: 12px; font-weight: 700;
  display: inline-flex; align-items: center; gap: 4px;
}
.chip-amber-pill {
  background: rgba(243,156,18,0.12);
  border: 1px solid rgba(243,156,18,0.3);
  color: var(--amber);
  border-radius: 9999px;
  padding: 4px 12px;
  font-size: 12px; font-weight: 700;
  display: inline-flex; align-items: center; gap: 4px;
}

/* Earnings hero */
.earnings-hero {
  background: linear-gradient(160deg, var(--navy), var(--navy-mid));
  padding: 24px 20px 20px;
}
.earn-label { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.5); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 4px; }
.earn-amount { font-size: 40px; font-weight: 800; color: var(--green); font-variant-numeric: tabular-nums; letter-spacing: -2px; line-height: 1; }
.earn-sub { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 4px; }

/* Row items */
.list-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 120ms;
}
.list-row:hover { background: rgba(249,92,0,0.03); }
.list-icon {
  width: 40px; height: 40px;
  border-radius: 10px;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.list-label { font-size: 13px; font-weight: 600; color: var(--tp); }
.list-sub { font-size: 11px; color: var(--ts); margin-top: 2px; }
.list-right { margin-left: auto; font-size: 12px; color: var(--ts); display: flex; align-items: center; gap: 6px; }

/* SOS button */
.sos-btn-wrap {
  position: absolute;
  top: 16px; right: 16px;
  z-index: 20;
}
.sos-btn {
  width: 52px; height: 52px;
  background: var(--red);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 800; color: white; letter-spacing: 0.3px;
  box-shadow: var(--glow-d), var(--sh-md);
  cursor: pointer; position: relative;
}
.sos-ring {
  position: absolute; inset: -5px;
  border-radius: 50%;
  border: 2px solid rgba(231,76,60,0.35);
  animation: sos-pulse 2s ease-in-out infinite;
}
@keyframes sos-pulse {
  0%,100% { transform:scale(1); opacity:0.7; }
  50%      { transform:scale(1.15); opacity:0; }
}

/* FAB */
.fab {
  position: absolute;
  bottom: 80px; right: 16px;
  width: 52px; height: 52px;
  background: var(--green);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  box-shadow: var(--glow-g), var(--sh-lg);
  cursor: pointer;
  transition: all 150ms var(--ease-spring);
}
.fab:hover { transform: scale(1.08); }

/* commission row */
.comm-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 16px;
}
.comm-label { font-size: 13px; color: var(--ts); font-weight: 500; }
.comm-value { font-size: 15px; font-weight: 700; }

/* Success state */
.success-anim {
  animation: pop-in 0.4s var(--ease-spring) both;
}
@keyframes pop-in {
  from { transform: scale(0.6); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}

/* Ripple found */
.found-slide {
  animation: found-up 0.35s var(--ease-spring) both;
}
@keyframes found-up {
  from { transform: translateY(60px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}

/* Driver splash */
.driver-splash {
  background: linear-gradient(160deg, var(--navy) 0%, var(--navy-mid) 100%);
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 40px 24px;
}

/* Green pill status */
.status-pill-wrap {
  position: absolute;
  top: 60px; left: 12px;
  z-index: 20;
}
.online-pill {
  background: var(--navy);
  border-radius: 9999px;
  padding: 6px 14px;
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 700;
  box-shadow: var(--sh-md);
}
.earn-pill {
  background: rgba(26,31,60,0.92);
  border-radius: 9999px;
  padding: 6px 14px;
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 700; color: white;
  box-shadow: var(--sh-md);
  margin-top: 6px;
}

/* Document step */
.doc-step {
  background: var(--white);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  margin: 0 16px 10px;
  display: flex; align-items: center; gap: 12px;
}
.doc-step-num {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--bg);
  border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800;
  color: var(--ts); flex-shrink: 0;
}
.doc-step.done .doc-step-num { background: var(--green-10); border-color: var(--green); color: var(--green); }
.doc-step.active .doc-step-num { background: var(--saffron-10); border-color: var(--saffron); color: var(--saffron); }
.doc-step-label { font-size: 13px; font-weight: 700; color: var(--navy); }
.doc-step-sub   { font-size: 11px; color: var(--ts); margin-top: 2px; }

/* Progress step bar */
.step-bar {
  display: flex; gap: 4px;
  margin: 0 16px 12px;
}
.seg { flex:1; height:4px; border-radius:2px; }
.seg-done { background: var(--saffron); }
.seg-curr { background: var(--amber); }
.seg-rem  { background: var(--border); }

/* Upload zone */
.upload-zone {
  border: 2px dashed rgba(249,92,0,0.35);
  border-radius: 12px;
  height: 100px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  background: rgba(249,92,0,0.03);
  cursor: pointer; transition: all 150ms;
  margin: 0 16px;
}
.upload-zone:hover { border-color: var(--saffron); background: rgba(249,92,0,0.07); }

/* Connectivity warning */
.conn-warn {
  background: #FFFBEB;
  border-bottom: 1px solid rgba(243,156,18,0.3);
  padding: 6px 16px;
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; font-weight: 600; color: #92400E;
}

/* Modal overlay */
.modal-overlay {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.5);
  display: flex; align-items: flex-end;
  z-index: 60;
  border-radius: 40px;
  opacity: 0; pointer-events: none;
  transition: opacity 300ms;
}
.modal-overlay.visible { opacity: 1; pointer-events: all; }
.modal-card {
  background: white;
  border-radius: 24px 24px 0 0;
  padding: 20px;
  width: 100%;
  transform: translateY(100%);
  transition: transform 320ms var(--ease-out);
}
.modal-overlay.visible .modal-card { transform: translateY(0); }

/* Search result list */
.search-result {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 100ms;
}
.search-result:hover { background: rgba(249,92,0,0.04); }
.result-icon {
  width: 36px; height: 36px;
  border-radius: 8px;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
}
.result-name { font-size: 13px; font-weight: 700; color: var(--tp); }
.result-address { font-size: 11px; color: var(--ts); margin-top: 2px; }

/* Profile header */
.profile-header {
  background: linear-gradient(160deg, var(--navy), var(--navy-mid));
  padding: 20px 20px 24px;
  display: flex; align-items: center; gap: 14px;
}
.profile-avatar {
  width: 60px; height: 60px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  border: 2px solid rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center;
  font-size: 26px;
}
.profile-name { font-size: 18px; font-weight: 700; color: white; }
.profile-phone { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 2px; }

/* Driver verification pending */
.pending-badge {
  width: 72px; height: 72px;
  border-radius: 50%;
  background: rgba(243,156,18,0.15);
  border: 2px solid rgba(243,156,18,0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px;
  margin: 20px auto 0;
}
</style>

                  <span style="font-size:12px;color:var(--ts);">Reference</span>
                  <span style="font-family:'JetBrains Mono';font-size:12px;font-weight:600;color:var(--saffron);">CHL-240219-0042</span>
                </div>
                <div style="display:flex;justify-content:space-between;padding:6px 0;">
                  <span style="font-size:12px;color:var(--ts);">Arrives by</span>
                  <span style="font-size:12px;font-weight:600;color:var(--tp);">Feb 21, 2026 (est.)</span>
                </div>
              </div>
              <button class="btn btn-g btn-w" onclick="navigate(-1)">↩ Back to Dashboard</button>
            </div>
          `
        },
      ]
    },
  ]
};

/* ============================================================
   STATE
============================================================ */
let currentApp = 'customer';
let currentFlowIdx = 0;
let currentStepIdx = 0;

function getCurrentFlows() {
  return FLOWS[currentApp];
}
function getCurrentFlow() {
  return getCurrentFlows()[currentFlowIdx];
}
function getCurrentStep() {
  return getCurrentFlow().steps[currentStepIdx];
}

/* ============================================================
   RENDER ENGINE
============================================================ */
function renderSidebar() {
  const flows = getCurrentFlows();
  const isDriver = currentApp === 'driver';
  let html = '';
  flows.forEach((flow, fi) => {
    html += `<div class="flow-group">
      <div class="flow-group-title">${flow.id} · ${flow.name}</div>`;
    flow.steps.forEach((step, si) => {
      const isCurrent = fi === currentFlowIdx && si === currentStepIdx;
      const isDone = fi < currentFlowIdx || (fi === currentFlowIdx && si < currentStepIdx);
      const cls = isCurrent ? (isDriver ? 'current-d' : 'current') : isDone ? 'done' : '';
      html += `
        ${si > 0 ? '<div class="step-connector"></div>' : ''}
        <div class="step-item ${cls}" onclick="jumpTo(${fi},${si})">
          <div class="step-dot"></div>
          <div class="step-label">${step.label}</div>
        </div>`;
    });
    html += '</div>';
  });
  document.getElementById('flow-list').innerHTML = html;
}

function renderScreen() {
  const step = getCurrentStep();
  const wrap = document.getElementById('screen-wrap');

  // Remove previous screens
  const prev = wrap.querySelector('.screen.active');
  const prevOld = wrap.querySelector('.screen.prev');
  if (prevOld) prevOld.remove();
  if (prev) {
    prev.classList.remove('active');
    prev.classList.add('prev');
    setTimeout(() => { if (prev.parentNode) prev.remove(); }, 400);
  }

  // Create new screen
  const scr = document.createElement('div');
  scr.className = 'screen';
  scr.innerHTML = step.render();
  wrap.appendChild(scr);
  // Force reflow
  scr.offsetHeight;
  scr.classList.add('active');

  // Status bar
  const sb = document.getElementById('status-bar');
  sb.className = 'status-bar' + (step.statusLight ? ' light' : '');

  // Glow
  const glow = document.getElementById('phone-glow');
  glow.className = 'phone-glow' + (currentApp === 'driver' ? ' driver-glow' : '');
}

function renderPanel() {
  const step = getCurrentStep();
  const flow = getCurrentFlow();
  const isDriver = currentApp === 'driver';
  const accent = isDriver ? 'var(--green)' : 'var(--saffron)';

  document.getElementById('panel-title').textContent = flow.name;
  document.getElementById('panel-title').style.color = accent;
  document.getElementById('panel-screen').textContent = step.label;

  let html = '';
  (step.annotations || []).forEach(a => {
    html += `<div class="annot-card ${a.color}">
      <div class="annot-key">${a.key}</div>
      <div class="annot-val">${a.val}</div>
    </div>`;
  });
  document.getElementById('panel-annotations').innerHTML = html;

  // Progress
  const totalSteps = getCurrentFlow().steps.length;
  document.getElementById('panel-progress').textContent =
    `Screen ${currentStepIdx + 1} of ${totalSteps} in this flow`;

  // Next button
  const btn = document.getElementById('btn-next');
  btn.className = 'nav-arr primary' + (isDriver ? ' green-btn' : '');

  const hasNext = currentStepIdx < getCurrentFlow().steps.length - 1;
  const hasNextFlow = currentFlowIdx < getCurrentFlows().length - 1;
  if (hasNext) {
    btn.textContent = 'Next →';
    btn.disabled = false;
  } else if (hasNextFlow) {
    btn.textContent = 'Next Flow →';
    btn.disabled = false;
  } else {
    btn.textContent = '✓ End';
    btn.disabled = false;
  }

  // Prev
  document.getElementById('btn-prev').disabled = (currentFlowIdx === 0 && currentStepIdx === 0);
}

function renderAll() {
  // Sidebar pills
  document.getElementById('pill-c').className = 'toggle-pill' + (currentApp === 'customer' ? ' active-c' : '');
  document.getElementById('pill-d').className = 'toggle-pill' + (currentApp === 'driver' ? ' active-d' : '');
  renderSidebar();
  renderScreen();
  renderPanel();
}

/* ============================================================
   NAVIGATION
============================================================ */
function navigate(dir) {
  const flow = getCurrentFlow();
  if (dir > 0) {
    if (currentStepIdx < flow.steps.length - 1) {
      currentStepIdx++;
    } else if (currentFlowIdx < getCurrentFlows().length - 1) {
      currentFlowIdx++;
      currentStepIdx = 0;
    }
  } else {
    if (currentStepIdx > 0) {
      currentStepIdx--;
    } else if (currentFlowIdx > 0) {
      currentFlowIdx--;
      currentStepIdx = getCurrentFlow().steps.length - 1;
    }
  }
  renderAll();
}

function jumpTo(flowIdx, stepIdx) {
  currentFlowIdx = flowIdx;
  currentStepIdx = stepIdx;
  renderAll();
}

function switchApp(app) {
  currentApp = app;
  currentFlowIdx = 0;
  currentStepIdx = 0;
  renderAll();
}

/* ============================================================
   KEYBOARD
============================================================ */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); navigate(1); }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); navigate(-1); }
});

/* ============================================================
   RATING STARS
============================================================ */
function rateStar(n) {
  document.querySelectorAll('.star').forEach((s, i) => {
    s.classList.toggle('lit', i < n);
    if (i < n) s.style.animation = 'pop-in 0.2s var(--ease-spring) both';
    setTimeout(() => s.style.animation = '', 300);
  });
}

/* ============================================================
   RIDE REQUEST COUNTDOWN (demo)
============================================================ */
let reqTimer = null;
function startReqCountdown() {
  let v = 40;
  reqTimer = setInterval(() => {
    v--;
    const el = document.getElementById('req-timer');
    const ring = document.getElementById('req-ring');
    if (!el || !ring) { clearInterval(reqTimer); return; }
    el.textContent = v;
    const c = 2 * Math.PI * 24;
    ring.style.strokeDashoffset = c - (v / 60) * c;
    if (v <= 10) { ring.style.stroke = 'var(--red)'; el.style.color = 'var(--red)'; }
    else if (v <= 20) { ring.style.stroke = 'var(--amber)'; el.style.color = 'var(--amber)'; }
    if (v <= 0) clearInterval(reqTimer);
  }, 1000);
}

/* ============================================================
   INIT
============================================================ */
renderAll();

// Observe DOM for ride request screen to start countdown
const observer = new MutationObserver(() => {
  if (document.getElementById('req-timer') && !reqTimer) {
    startReqCountdown();
  } else if (!document.getElementById('req-timer') && reqTimer) {
    clearInterval(reqTimer);
    reqTimer = null;
  }
});
observer.observe(document.getElementById('screen-wrap'), { childList: true, subtree: true });
</script>
</body>
</html>
