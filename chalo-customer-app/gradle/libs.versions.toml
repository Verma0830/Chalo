[versions]
# Core
agp                    = "8.3.2"
kotlin                 = "1.9.23"
ksp                    = "1.9.23-1.0.20"

# Compose
composeBom             = "2024.04.01"
activityCompose        = "1.9.0"
navigationCompose      = "2.7.7"
lifecycleRuntimeCompose = "2.7.0"

# DI
hilt                   = "2.51.1"
hiltNavigationCompose  = "1.2.0"

# Network
retrofit               = "2.11.0"
okhttp                 = "4.12.0"
gson                   = "2.10.1"

# Local DB
room                   = "2.6.1"

# Image
coil                   = "2.6.0"

# Firebase
googleServices         = "4.4.1"
firebaseBom            = "32.8.1"

# Maps
mapsCompose            = "4.3.3"
playServicesMaps       = "18.2.0"
playServicesLocation   = "21.2.0"
places                 = "3.5.0"
playServicesAuth       = "21.2.0"

# Permissions
accompanistPermissions = "0.34.0"

# DataStore
datastore              = "1.1.1"

# Timber
timber                 = "5.0.1"

# Testing
junit                  = "4.13.2"
mockk                  = "1.13.10"
turbine                = "1.1.0"
coroutinesTest         = "1.7.3"
archCoreTesting        = "2.2.0"

# Android core
coreKtx                = "1.13.0"
appcompat              = "1.6.1"
material               = "1.11.0"

[libraries]
# AndroidX Core
androidx-core-ktx          = { group = "androidx.core",     name = "core-ktx",           version.ref = "coreKtx" }
androidx-appcompat         = { group = "androidx.appcompat", name = "appcompat",          version.ref = "appcompat" }

# Lifecycle
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeCompose" }

# Compose BOM
androidx-compose-bom        = { group = "androidx.compose",  name = "compose-bom",        version.ref = "composeBom" }
androidx-ui                 = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics        = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-tooling         = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-material3          = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-activity-compose   = { group = "androidx.activity", name = "activity-compose",   version.ref = "activityCompose" }

# Navigation
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Hilt DI
hilt-android               = { group = "com.google.dagger", name = "hilt-android",        version.ref = "hilt" }
hilt-android-compiler      = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose    = { group = "androidx.hilt",     name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Network
retrofit                   = { group = "com.squareup.retrofit2", name = "retrofit",          version.ref = "retrofit" }
retrofit-gson              = { group = "com.squareup.retrofit2", name = "converter-gson",    version.ref = "retrofit" }
okhttp-bom                 = { group = "com.squareup.okhttp3",   name = "okhttp-bom",        version.ref = "okhttp" }
okhttp                     = { group = "com.squareup.okhttp3",   name = "okhttp" }
okhttp-logging             = { group = "com.squareup.okhttp3",   name = "logging-interceptor" }
gson                       = { group = "com.google.code.gson",   name = "gson",              version.ref = "gson" }

# Room
room-runtime               = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx                   = { group = "androidx.room", name = "room-ktx",     version.ref = "room" }
room-compiler              = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Image
coil-compose               = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# Firebase
firebase-bom               = { group = "com.google.firebase", name = "firebase-bom",          version.ref = "firebaseBom" }
firebase-auth              = { group = "com.google.firebase", name = "firebase-auth-ktx" }
firebase-database          = { group = "com.google.firebase", name = "firebase-database-ktx" }
firebase-messaging         = { group = "com.google.firebase", name = "firebase-messaging-ktx" }
firebase-crashlytics       = { group = "com.google.firebase", name = "firebase-crashlytics-ktx" }

# Maps
maps-compose               = { group = "com.google.maps.android", name = "maps-compose",          version.ref = "mapsCompose" }
play-services-maps         = { group = "com.google.android.gms",  name = "play-services-maps",    version.ref = "playServicesMaps" }
play-services-location     = { group = "com.google.android.gms",  name = "play-services-location", version.ref = "playServicesLocation" }
play-services-auth         = { group = "com.google.android.gms",  name = "play-services-auth",     version.ref = "playServicesAuth" }
places                     = { group = "com.google.android.libraries.places", name = "places",    version.ref = "places" }

# Permissions
accompanist-permissions    = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanistPermissions" }

# DataStore
datastore-preferences      = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Timber
timber                     = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }

# Testing
junit                      = { group = "junit",                              name = "junit",                         version.ref = "junit" }
mockk                      = { group = "io.mockk",                           name = "mockk",                         version.ref = "mockk" }
turbine                    = { group = "app.cash.turbine",                   name = "turbine",                       version.ref = "turbine" }
kotlinx-coroutines-test    = { group = "org.jetbrains.kotlinx",             name = "kotlinx-coroutines-test",       version.ref = "coroutinesTest" }
androidx-arch-core-testing = { group = "androidx.arch.core",                name = "core-testing",                  version.ref = "archCoreTesting" }

[plugins]
android-application  = { id = "com.android.application",          version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",      version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt-android         = { id = "com.google.dagger.hilt.android",    version.ref = "hilt" }
ksp                  = { id = "com.google.devtools.ksp",           version.ref = "ksp" }
google-services      = { id = "com.google.gms.google-services",    version.ref = "googleServices" }
