# ============================================================
# Chalo Backend — CI Pipeline
# Runs on every push and PR to main
# Lint → Build → Test
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_ENV: test
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/chalo_test?schema=public"
  REDIS_URL: "redis://localhost:6379"

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chalo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chalo-backend/package-lock.json

      - name: Install dependencies
        working-directory: chalo-backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: chalo-backend
        run: npx prisma generate

      - name: Run database migrations
        working-directory: chalo-backend
        run: npx prisma migrate deploy

      - name: Lint
        working-directory: chalo-backend
        run: npm run lint

      - name: Build
        working-directory: chalo-backend
        run: npm run build

      - name: Test
        working-directory: chalo-backend
        run: npm test -- --coverage --forceExit
