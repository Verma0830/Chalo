# ============================================================
# Chalo Backend — CI Pipeline
# Runs on every push and PR to main
#
# Jobs run in parallel where possible:
#   lint  ─┐
#           ├─► build (after both pass)
#   test  ─┘
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ─────────────────────────────────────────────
  # Job 1: Lint (no DB needed — runs immediately)
  # ─────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4.0.4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: chalo-backend/package-lock.json

      - name: Install dependencies
        working-directory: chalo-backend
        run: npm ci --no-audit --no-fund

      - name: TypeScript type check
        working-directory: chalo-backend
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: chalo-backend
        run: npm run lint

      - name: Security audit (high severity only)
        working-directory: chalo-backend
        run: npm audit --audit-level=high
        # Allow the job to continue — advisory only (does not block merge)
        continue-on-error: true

  # ─────────────────────────────────────────────
  # Job 2: Test (needs DB + Redis)
  # ─────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/chalo_test?schema=public"
      REDIS_URL: "redis://localhost:6379"

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chalo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4.0.4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: chalo-backend/package-lock.json

      - name: Install dependencies
        working-directory: chalo-backend
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        working-directory: chalo-backend
        run: npx prisma generate

      - name: Run database migrations
        working-directory: chalo-backend
        run: npx prisma migrate deploy

      - name: Run tests with coverage
        working-directory: chalo-backend
        run: npm test -- --coverage --forceExit

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4.5.0
        with:
          directory: chalo-backend/coverage
          flags: backend
          fail_ci_if_error: false
        # Set CODECOV_TOKEN in GitHub repo secrets to enable coverage tracking
        # Get token at: https://app.codecov.io → add your repo → copy token
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ─────────────────────────────────────────────
  # Job 3: Build (runs after lint + test both pass)
  # ─────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4.0.4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: chalo-backend/package-lock.json

      - name: Install dependencies
        working-directory: chalo-backend
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        working-directory: chalo-backend
        run: npx prisma generate

      - name: TypeScript build
        working-directory: chalo-backend
        run: npm run build

      - name: Verify dist output exists
        run: test -f chalo-backend/dist/server.js

  # ─────────────────────────────────────────────
  # Job 4: Android — lint, unit tests, debug build
  # Runs in parallel with backend jobs (no dependency)
  # ─────────────────────────────────────────────
  android:
    name: Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4.2.2
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
          gradle-home-cache-cleanup: true

      # local.properties is not committed — create a minimal one for CI
      # DEV_BASE_URL is not used in CI builds (no emulator), Maps key is a placeholder
      - name: Create local.properties
        run: |
          cat > chalo-customer-app/local.properties << 'EOF'
          sdk.dir=$ANDROID_SDK_ROOT
          DEV_BASE_URL=http://10.0.2.2:3001/api/v1
          MAPS_API_KEY=CI_PLACEHOLDER_NOT_NEEDED_FOR_UNIT_TESTS
          EOF

      - name: Run Android lint
        run: gradle -p chalo-customer-app lint --stacktrace
        # Lint report available at app/build/reports/lint-results-debug.html

      - name: Run Android unit tests
        run: gradle -p chalo-customer-app test --stacktrace

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4.3.6
        with:
          name: android-unit-test-results
          path: chalo-customer-app/app/build/reports/tests/
          retention-days: 7

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4.3.6
        with:
          name: android-lint-report
          path: chalo-customer-app/app/build/reports/lint-results-*.html
          retention-days: 7

      - name: Build debug APK
        run: gradle -p chalo-customer-app assembleDebug --stacktrace

      - name: Verify APK was produced
        run: test -f chalo-customer-app/app/build/outputs/apk/debug/app-debug.apk
