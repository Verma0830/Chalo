# ============================================================
# Chalo Backend — Docker Compose (Development)
# Brings up PostgreSQL + PostGIS, Redis, and the backend API
# ============================================================

version: "3.9"

services:
  # ---------- PostgreSQL + PostGIS ----------
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: chalo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chalo_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    container_name: chalo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Backend API ----------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chalo-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:password@postgres:5432/chalo_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      # Set real values via .env file or environment
      FIREBASE_SERVICE_ACCOUNT_PATH: "./firebase-service-account.json"
      FIREBASE_DATABASE_URL: "${FIREBASE_DATABASE_URL:-}"
      RAZORPAY_KEY_ID: "${RAZORPAY_KEY_ID:-}"
      RAZORPAY_KEY_SECRET: "${RAZORPAY_KEY_SECRET:-}"
      RAZORPAY_WEBHOOK_SECRET: "${RAZORPAY_WEBHOOK_SECRET:-}"
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY:-}"
      MSG91_AUTH_KEY: "${MSG91_AUTH_KEY:-}"
      MSG91_SENDER_ID: "${MSG91_SENDER_ID:-CHALO}"
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:-}"
      LOG_LEVEL: "info"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Run migrations then start
    command: >
      sh -c "npx prisma migrate deploy && node dist/server.js"

volumes:
  pgdata:
  redisdata:
